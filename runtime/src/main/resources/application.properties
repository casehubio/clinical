quarkus.application.name=casehub-clinical

# ============================================================
# Default datasource — clinical domain + casehub-work tables
# Flyway location: clinical-specific migrations only (db/migration/default/).
# casehub-work migrations (V1–V21) are in classpath:db/migration but must NOT
# be scanned here — qhorus V1–V9 are also in classpath:db/migration and conflict.
# In production, casehub-work schema is pre-provisioned by infrastructure.
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.packages=io.casehub.work.runtime,io.casehub.clinical.entity,io.casehub.platform.memory.jpa
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.locations=db/migration/default,classpath:db/memory/migration
quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:clinical;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.schema-management.strategy=none

# ============================================================
# Qhorus named datasource — qhorus + casehub-ledger tables
# Platform convention: ledger always shares the qhorus PU.
# Flyway: qhorus jar migrations (classpath:db/migration) + clinical ledger migrations.
# ============================================================
quarkus.datasource.qhorus.db-kind=postgresql
quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model,io.casehub.clinical.ledger
quarkus.hibernate-orm.qhorus.schema-management.strategy=validate
quarkus.flyway.qhorus.locations=classpath:db/migration,classpath:db/migration/qhorus,classpath:db/engine-ledger/migration
quarkus.flyway.qhorus.migrate-at-start=true

%dev.quarkus.datasource.qhorus.db-kind=h2
%dev.quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:qhorus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.qhorus.username=sa
%dev.quarkus.datasource.qhorus.password=

# Direct casehub-ledger to the qhorus persistence unit
casehub.ledger.datasource=qhorus
# Enable actorId tokenisation — required for LedgerErasureService.erase() to pseudonymize
# actorId fields on consent withdrawal (GDPR Art.17). Without this flag,
# InternalActorIdentityProvider is inactive and erase() is a no-op.
casehub.ledger.identity.tokenisation.enabled=true

# Select the JPA ledger implementation — JpaLedgerEntryRepository is @Alternative;
# Quarkus ArC requires explicit selection (beans.xml <alternatives> is not supported).
quarkus.arc.selected-alternatives=\
  io.casehub.ledger.runtime.repository.jpa.JpaLedgerEntryRepository,\
  io.casehub.persistence.jpa.JpaPlanItemStore,\
  io.casehub.persistence.jpa.JpaSubCaseGroupRepository

# ── Engine CDI wiring (production) ────────────────────────────────────────────
# CasehubWorkloadProvider (engine-internal) conflicts with JpaWorkloadProvider (casehub-work).
# Exclude the engine-internal one in production; JpaWorkloadProvider manages work assignments.
#
# TenantScopedPrincipal (casehub-work @RequestScoped) competes with
# QhorusInboundCurrentPrincipal (casehub-qhorus @ApplicationScoped) — both are non-default
# CurrentPrincipal implementations, causing AmbiguousResolutionException in production
# augmentation. Clinical resolves tenant context via QhorusInboundCurrentPrincipal
# (X-Tenancy-ID header); TenantScopedPrincipal belongs exclusively to casehub-work deployments.
# Tracked for upstream fix: casehubio/work#268 — make TenantScopedPrincipal @Alternative.
%prod.quarkus.arc.exclude-types=\
  io.casehub.engine.internal.worker.CasehubWorkloadProvider,\
  io.casehub.work.runtime.service.TenantScopedPrincipal

# ── CaseMemoryStore — JPA adapter CDI wiring (production) ─────────────────────
# casehub-platform-memory-jpa lacks Jandex index (no quarkus:build goal) — force scanning.
# JpaMemoryStore @ApplicationScoped displaces NoOpCaseMemoryStore @DefaultBean by classpath presence.
# No selected-alternatives entry needed for production — displacement is automatic.
%prod.quarkus.index-dependency.memory-jpa.group-id=io.casehub
%prod.quarkus.index-dependency.memory-jpa.artifact-id=casehub-platform-memory-jpa

# casehub-engine and casehub-engine-common lack Jandex indices — force discovery.
# JQEvaluator (@ApplicationScoped) lives in engine-common; EventLogRepository
# implementations live in casehub-engine. Without indexing these jars, CDI startup fails.
%prod.quarkus.index-dependency.casehub-engine.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine.artifact-id=casehub-engine
%prod.quarkus.index-dependency.casehub-engine-common.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine-common.artifact-id=casehub-engine-common
%prod.quarkus.index-dependency.casehub-engine-persistence-hibernate.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine-persistence-hibernate.artifact-id=casehub-engine-persistence-hibernate

# XA is required when a single transaction writes to both datasources (default + qhorus).
# ProtocolDeviationService, DeviationExpirer, and AdverseEventService all do this.
quarkus.datasource.jdbc.transactions=xa
quarkus.datasource.qhorus.jdbc.transactions=xa

# Reactive suppression — production datasources are JDBC-only; reactive Quarkus driver is
# not configured. Without this, qhorus reactive service beans (ReactiveMessageStore etc.)
# fail CDI validation. Matches the test application.properties suppression pattern.
quarkus.datasource.reactive=false
quarkus.datasource.qhorus.reactive=false
